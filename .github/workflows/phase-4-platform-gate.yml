name: Phase 4 platform gate

on:
  workflow_dispatch:
  push:
    branches:
      - phase4-platform-gate

permissions:
  contents: read

jobs:
  package-and-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac
          - os: ubuntu-24.04
            platform: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      NPM_CONFIG_CACHE: ${{ github.workspace }}/.local-cache/npm
      XDG_CACHE_HOME: ${{ github.workspace }}/.local-cache
      COREPACK_HOME: ${{ github.workspace }}/.local-cache/corepack
      ELECTRON_CACHE: ${{ github.workspace }}/.local-cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.local-cache/electron-builder
      UV_CACHE_DIR: ${{ github.workspace }}/.local-cache/uv
      UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/.tools/python
      TMPDIR: ${{ github.workspace }}/.local-tmp
      TEMP: ${{ github.workspace }}/.local-tmp
      TMP: ${{ github.workspace }}/.local-tmp
      HYPER_STUDIO_USER_DATA: ${{ github.workspace }}/.local-cache/hyper-studio-user-data
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - name: Prepare repository-local tools and caches
        shell: bash
        run: |
          mkdir -p .local-cache .local-tmp .tools/pnpm10 .tools/pnpm11
          npm install --prefix .tools/pnpm10 --no-audit --no-fund pnpm@10.30.3
          npm install --prefix .tools/pnpm11 --no-audit --no-fund pnpm@11.13.1
          echo "$GITHUB_WORKSPACE/.tools/pnpm10/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Build pinned workflow canvas
        shell: bash
        run: |
          export PATH="$GITHUB_WORKSPACE/.tools/pnpm11/node_modules/.bin:$PATH"
          pnpm --version
          node .tools/pnpm11/node_modules/pnpm/bin/pnpm.cjs --dir apps/workflow-ui install --frozen-lockfile --store-dir "$GITHUB_WORKSPACE/.local-cache/pnpm11"
          (cd apps/workflow-ui && node node_modules/vue-tsc/bin/vue-tsc.js --noEmit -p tsconfig.hyper-studio.json)
          (cd apps/workflow-ui && DISTRIBUTION=desktop VITE_HYPER_STUDIO_EMBEDDED=true node node_modules/vite/bin/vite.js build --config vite.config.mts)
          if ! grep -R -F -q 'hyper-studio:request-workflow' apps/workflow-ui/dist/assets; then
            echo 'Embedded workflow bridge is missing from the canvas build' >&2
            exit 1
          fi
      - name: Test embedded workflow account isolation
        shell: bash
        run: |
          cd apps/workflow-ui
          node node_modules/vitest/vitest.mjs run \
            src/platform/cloud/onboarding/embeddedAccountIsolation.test.ts \
            src/components/actionbar/ComfyRunButton/LocalRunButtonWrapper.test.ts \
            src/services/dialogService.subscriptionRequired.test.ts \
            src/stores/userStore.test.ts \
            src/composables/useTemplateFiltering.test.ts \
            src/platform/settings/composables/useSettingUI.test.ts \
            src/platform/settings/composables/useSettingSearch.test.ts \
            src/workbench/extensions/manager/composables/nodePack/localManagerPackCatalog.test.ts \
            src/components/rightSidePanel/errors/MissingPackGroupRow.test.ts
      - name: Test local managed node-pack catalog
        shell: bash
        run: PYTHONPATH=services/workflow python3 -m unittest services/workflow/tests-unit/hyper_studio_pack_catalog_test.py
      - name: Build and test desktop shell
        shell: bash
        run: |
          node .tools/pnpm10/node_modules/pnpm/bin/pnpm.cjs --dir apps/desktop install --frozen-lockfile --store-dir "$GITHUB_WORKSPACE/.local-cache/pnpm10"
          node .tools/pnpm10/node_modules/pnpm/bin/pnpm.cjs --dir apps/desktop run scripts:test
          node .tools/pnpm10/node_modules/pnpm/bin/pnpm.cjs --dir apps/desktop exec tsc --noEmit
          node apps/desktop/scripts/typecheck-internal.mjs
          node .tools/pnpm10/node_modules/pnpm/bin/pnpm.cjs --dir apps/desktop exec vite build
          node .tools/pnpm10/node_modules/pnpm/bin/pnpm.cjs --dir apps/desktop exec vite build --config vite.remote.config.ts
      - name: Prepare pinned workflow runtime tool
        shell: bash
        run: node scripts/prepare-workflow-tool.mjs ${{ matrix.platform == 'mac' && 'macos-arm64' || 'linux-x64' }}
      - name: Package and smoke macOS
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          node .tools/pnpm10/node_modules/pnpm/bin/pnpm.cjs --dir apps/desktop exec electron-builder --mac --arm64 --dir --publish never
          export HYPER_STUDIO_SMOKE_EXE="$GITHUB_WORKSPACE/apps/desktop/release/mac-arm64/Hyper-Studio.app/Contents/MacOS/Hyper-Studio"
          node scripts/smoke-packaged-electron.mjs
      - name: Package and smoke Linux
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          node .tools/pnpm10/node_modules/pnpm/bin/pnpm.cjs --dir apps/desktop exec electron-builder --linux --x64 --dir --publish never
          export HYPER_STUDIO_SMOKE_EXE="$GITHUB_WORKSPACE/apps/desktop/release/linux-unpacked/hyper-studio"
          xvfb-run -a node scripts/smoke-packaged-linux-cdp.mjs
      - name: Audit packaged brand assets
        shell: bash
        run: |
          node scripts/audit-branding.mjs
          node -e 'const a=require("./.local-cache/brand-audit/audit.json"); if (a.summary.builtResidualVisualNames || a.built.filter(x => x.present).length < 3) process.exit(1)'
          if grep -R -F -q 'M170.474 8.75283' apps/workflow-ui/dist/assets; then
            echo 'Old Comfy wordmark remains in workflow bundle' >&2
            exit 1
          fi
      - name: Preserve packaged smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-smoke-${{ matrix.platform }}
          path: |
            .local-tmp/packaged-electron-smoke/*.png
            .local-tmp/packaged-electron-smoke/linux/*.png
            .local-tmp/packaged-electron-smoke/electron.log
            .local-tmp/packaged-electron-smoke/linux/electron.log
            .local-tmp/packaged-electron-smoke/linux/electron-stdout.log
            .local-tmp/packaged-electron-smoke/linux/electron-stderr.log
            .local-tmp/packaged-electron-smoke/user-data/logs/session_*.log
            .local-tmp/hs-linux/ud/logs/session_*.log
            .local-tmp/packaged-electron-smoke/shared-storage/caches/workflow/diagnostics/engine-startup.log
            .local-tmp/packaged-electron-smoke/shared-storage/caches/workflow/*/install.log
            .local-tmp/packaged-electron-smoke/linux/shared-storage/caches/workflow/diagnostics/engine-startup.log
            .local-tmp/packaged-electron-smoke/linux/shared-storage/caches/workflow/*/install.log
          if-no-files-found: ignore
