name: Phase 4 platform gate

on:
  workflow_dispatch:
  push:
    branches:
      - phase4-platform-gate

permissions:
  contents: read

jobs:
  package-and-smoke:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac
          - os: ubuntu-24.04
            platform: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      NPM_CONFIG_CACHE: ${{ github.workspace }}/.local-cache/npm
      XDG_CACHE_HOME: ${{ github.workspace }}/.local-cache
      COREPACK_HOME: ${{ github.workspace }}/.local-cache/corepack
      ELECTRON_CACHE: ${{ github.workspace }}/.local-cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.local-cache/electron-builder
      UV_CACHE_DIR: ${{ github.workspace }}/.local-cache/uv
      UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/.tools/python
      TMPDIR: ${{ github.workspace }}/.local-tmp
      TEMP: ${{ github.workspace }}/.local-tmp
      TMP: ${{ github.workspace }}/.local-tmp
      HYPER_STUDIO_USER_DATA: ${{ github.workspace }}/.local-cache/hyper-studio-user-data
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - name: Prepare repository-local tools and caches
        shell: bash
        run: |
          mkdir -p .local-cache .local-tmp .tools/pnpm10 .tools/pnpm11
          npm install --prefix .tools/pnpm10 --no-audit --no-fund pnpm@10.30.3
          npm install --prefix .tools/pnpm11 --no-audit --no-fund pnpm@11.13.1
          echo "$GITHUB_WORKSPACE/.tools/pnpm10/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Build pinned workflow canvas
        shell: bash
        run: |
          export PATH="$GITHUB_WORKSPACE/.tools/pnpm11/node_modules/.bin:$PATH"
          pnpm --version
          node .tools/pnpm11/node_modules/pnpm/bin/pnpm.cjs --dir apps/workflow-ui install --frozen-lockfile --store-dir "$GITHUB_WORKSPACE/.local-cache/pnpm11"
          (cd apps/workflow-ui && node --max-old-space-size=4096 node_modules/vue-tsc/bin/vue-tsc.js --noEmit -p tsconfig.hyper-studio.json)
          (cd apps/workflow-ui && DISTRIBUTION=localhost VITE_HYPER_STUDIO_EMBEDDED=true node node_modules/vite/bin/vite.js build --config vite.config.mts)
          if ! grep -R -F -q 'hyper-studio:request-workflow' apps/workflow-ui/dist/assets; then
            echo 'Embedded workflow bridge is missing from the canvas build' >&2
            exit 1
          fi
      - name: Test embedded workflow account isolation
        shell: bash
        run: |
          cd apps/workflow-ui
          node node_modules/vitest/vitest.mjs run \
            src/platform/cloud/onboarding/embeddedAccountIsolation.test.ts \
            src/platform/distribution/embeddedAccountIdentity.test.ts \
            src/platform/distribution/hyperStudioEmbedBridge.test.ts \
            src/platform/workflow/core/services/workflowActionsService.test.ts \
            src/components/actionbar/ComfyRunButton/LocalRunButtonWrapper.test.ts \
            src/renderer/extensions/layerEditor/composables/useLayerEditorExport.test.ts \
            src/utils/errorReportUtil.test.ts \
            src/services/dialogService.subscriptionRequired.test.ts \
            src/stores/userStore.test.ts \
            src/composables/useTemplateFiltering.test.ts \
            src/platform/settings/composables/useSettingUI.test.ts \
            src/platform/settings/composables/useSettingSearch.test.ts \
            src/platform/settings/components/SettingGroup.test.ts \
            src/workbench/extensions/manager/composables/nodePack/localManagerPackCatalog.test.ts \
            src/services/gateway/registrySearchGateway.hyperStudio.test.ts \
            src/components/rightSidePanel/errors/MissingPackGroupRow.test.ts
      - name: Test local managed node-pack catalog
        shell: bash
        run: PYTHONPATH=services/workflow python3 -m unittest services/workflow/tests-unit/hyper_studio_pack_catalog_test.py
      - name: Build and test desktop shell
        shell: bash
        run: |
          node .tools/pnpm10/node_modules/pnpm/bin/pnpm.cjs --dir apps/desktop install --frozen-lockfile --store-dir "$GITHUB_WORKSPACE/.local-cache/pnpm10"
          node .tools/pnpm10/node_modules/pnpm/bin/pnpm.cjs --dir apps/desktop run scripts:test
          node .tools/pnpm10/node_modules/pnpm/bin/pnpm.cjs --dir apps/desktop exec tsc --noEmit
          node apps/desktop/scripts/typecheck-internal.mjs
          node .tools/pnpm10/node_modules/pnpm/bin/pnpm.cjs --dir apps/desktop exec vite build
          node .tools/pnpm10/node_modules/pnpm/bin/pnpm.cjs --dir apps/desktop exec vite build --config vite.remote.config.ts
      - name: Prepare pinned workflow runtime tool
        shell: bash
        run: node scripts/prepare-workflow-tool.mjs ${{ matrix.platform == 'mac' && 'macos-arm64' || 'linux-x64' }}
      - name: Package and smoke macOS
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          node .tools/pnpm10/node_modules/pnpm/bin/pnpm.cjs --dir apps/desktop exec electron-builder --mac --arm64 --dir --publish never
          export HYPER_STUDIO_SMOKE_EXE="$GITHUB_WORKSPACE/apps/desktop/release/mac-arm64/Hyper-Studio.app/Contents/MacOS/Hyper-Studio"
          node scripts/smoke-packaged-electron.mjs
      - name: Package and smoke Linux
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          node .tools/pnpm10/node_modules/pnpm/bin/pnpm.cjs --dir apps/desktop exec electron-builder --linux --x64 --dir --publish never
          export HYPER_STUDIO_SMOKE_EXE="$GITHUB_WORKSPACE/apps/desktop/release/linux-unpacked/hyper-studio"
          xvfb-run -a node scripts/smoke-packaged-linux-cdp.mjs
      - name: Audit packaged brand assets
        shell: bash
        run: |
          node scripts/audit-branding.mjs
          node -e 'const a=require("./.local-cache/brand-audit/audit.json"); if (a.summary.builtResidualVisualNames || a.built.filter(x => x.present).length < 3) process.exit(1)'
          if grep -R -F -q 'M170.474 8.75283' apps/workflow-ui/dist/assets; then
            echo 'Old Comfy wordmark remains in workflow bundle' >&2
            exit 1
          fi
      - name: Preserve packaged smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-smoke-${{ matrix.platform }}
          path: |
            .local-tmp/packaged-electron-smoke/*.png
            .local-tmp/packaged-electron-smoke/linux/*.png
            .local-tmp/packaged-electron-smoke/electron.log
            .local-tmp/packaged-electron-smoke/linux/electron.log
            .local-tmp/packaged-electron-smoke/linux/electron-stdout.log
            .local-tmp/packaged-electron-smoke/linux/electron-stderr.log
            .local-tmp/packaged-electron-smoke/user-data/logs/session_*.log
            .local-tmp/hs-linux/ud/logs/session_*.log
            .local-tmp/packaged-electron-smoke/shared-storage/caches/workflow/diagnostics/engine-startup.log
            .local-tmp/packaged-electron-smoke/shared-storage/caches/workflow/*/install.log
            .local-tmp/packaged-electron-smoke/linux/shared-storage/caches/workflow/diagnostics/engine-startup.log
            .local-tmp/packaged-electron-smoke/linux/shared-storage/caches/workflow/*/install.log
          if-no-files-found: ignore

  windows-package-and-smoke:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      NPM_CONFIG_CACHE: ${{ github.workspace }}/.local-cache/npm
      ELECTRON_CACHE: ${{ github.workspace }}/.local-cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.local-cache/electron-builder
      TEMP: ${{ github.workspace }}/.local-tmp
      TMP: ${{ github.workspace }}/.local-tmp
      TMPDIR: ${{ github.workspace }}/.local-tmp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - name: Prepare repository-local package managers and caches
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .local-cache, .local-tmp, .tools/pnpm10, .tools/pnpm11 | Out-Null
          & ./scripts/with-local-env.ps1 -Executable npm.cmd -Arguments @('install', '--prefix', '.tools/pnpm10', '--no-audit', '--no-fund', 'pnpm@10.30.3')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./scripts/with-local-env.ps1 -Executable npm.cmd -Arguments @('install', '--prefix', '.tools/pnpm11', '--no-audit', '--no-fund', 'pnpm@11.13.1')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $env:GITHUB_WORKSPACE '.tools/pnpm10/node_modules/.bin')
      - name: Build embedded workflow canvas
        shell: pwsh
        run: |
          $env:PATH = (Join-Path $env:GITHUB_WORKSPACE '.tools/pnpm11/node_modules/.bin') + ';' + $env:PATH
          & ./scripts/with-local-env.ps1 -Executable node -Arguments @('.tools/pnpm11/node_modules/pnpm/bin/pnpm.cjs', '--dir', 'apps/workflow-ui', 'install', '--frozen-lockfile', '--store-dir', "$env:GITHUB_WORKSPACE/.local-cache/pnpm11")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location apps/workflow-ui
          try {
            $env:DISTRIBUTION = 'localhost'
            $env:VITE_HYPER_STUDIO_EMBEDDED = 'true'
            & ../../scripts/with-local-env.ps1 -Executable node -Arguments @('node_modules/vite/bin/vite.js', 'build', '--config', 'vite.config.mts')
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Pop-Location }
      - name: Build and test desktop
        shell: pwsh
        run: |
          $env:PATH = (Join-Path $env:GITHUB_WORKSPACE '.tools/pnpm10/node_modules/.bin') + ';' + $env:PATH
          & ./scripts/with-local-env.ps1 -Executable node -Arguments @('.tools/pnpm10/node_modules/pnpm/bin/pnpm.cjs', '--dir', 'apps/desktop', 'install', '--frozen-lockfile', '--store-dir', "$env:GITHUB_WORKSPACE/.local-cache/pnpm10")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location apps/desktop
          try {
            & ../../scripts/with-local-env.ps1 -Executable node -Arguments @('--experimental-strip-types', '--test', '--test-reporter=spec', 'frontend/**/*.test.ts', 'electron/**/*.test.ts', 'shared/**/*.test.ts')
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & ../../scripts/with-local-env.ps1 -Executable node -Arguments @('--experimental-strip-types', '--test', '--experimental-loader', './frontend/views/editor/editor-test-loader.mjs', 'frontend/views/editor/editor-actions.test.mjs', 'frontend/lib/project-asset-metadata-migration.test.mjs')
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & ../../scripts/with-local-env.ps1 -Executable node -Arguments @('node_modules/typescript/bin/tsc', '--noEmit')
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & ../../scripts/with-local-env.ps1 -Executable node -Arguments @('node_modules/vite/bin/vite.js', 'build')
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & ../../scripts/with-local-env.ps1 -Executable node -Arguments @('node_modules/vite/bin/vite.js', 'build', '--config', 'vite.remote.config.ts')
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Pop-Location }
      - name: Test embedded local Manager catalog
        shell: pwsh
        run: |
          Push-Location apps/workflow-ui
          try {
            & ../../scripts/with-local-env.ps1 -Executable node -Arguments @('node_modules/vitest/vitest.mjs', 'run', 'src/services/gateway/registrySearchGateway.hyperStudio.test.ts', 'src/workbench/extensions/manager/composables/nodePack/localManagerPackCatalog.test.ts')
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Pop-Location }
          $env:PYTHONPATH = (Join-Path $env:GITHUB_WORKSPACE 'services/workflow')
          & ./scripts/with-local-env.ps1 -Executable python -Arguments @('-B', '-m', 'unittest', 'services/workflow/tests-unit/hyper_studio_pack_catalog_test.py')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package unsigned Windows installer and install inside checkout
        shell: pwsh
        run: |
          $env:PATH = (Join-Path $env:GITHUB_WORKSPACE '.tools/pnpm10/node_modules/.bin') + ';' + $env:PATH
          & ./scripts/prepare-workflow-tool.ps1
          Push-Location apps/desktop
          try {
            & ../../scripts/with-local-env.ps1 -Executable node -Arguments @('node_modules/electron-builder/cli.js', '--win', '--x64', '--publish', 'never')
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Pop-Location }
          & ./scripts/install-windows-local.ps1 -Destination '.local-tmp/installed-ci'
      - name: Smoke installed Windows app and audit brand
        shell: pwsh
        run: |
          $env:HYPER_STUDIO_SMOKE_EXE = (Resolve-Path '.local-tmp/installed-ci/Hyper-Studio.exe').Path
          $env:HYPER_STUDIO_EDITOR_SMOKE_EXE = $env:HYPER_STUDIO_SMOKE_EXE
          $env:HYPER_STUDIO_STORAGE_SMOKE_HOME = Join-Path $env:GITHUB_WORKSPACE '.local-tmp/first-run-storage-smoke'
          $env:HYPER_STUDIO_SETTINGS_SMOKE_HOME = Join-Path $env:GITHUB_WORKSPACE '.local-tmp/settings-shortcuts-smoke'
          $smokes = @(
            'scripts/smoke-first-run-storage.mjs',
            'scripts/smoke-packaged-electron.mjs',
            'scripts/smoke-project-controls.mjs',
            'scripts/smoke-first-party-controls.mjs',
            'scripts/smoke-settings-shortcuts.mjs',
            'scripts/smoke-editor-controls.mjs',
            'scripts/smoke-editor-track-commands.mjs',
            'scripts/smoke-workflow-controls.mjs',
            'scripts/smoke-workflow-widget-undo.mjs',
            'scripts/smoke-workflow-run-isolation.mjs',
            'scripts/smoke-manager-local-install.mjs',
            'scripts/smoke-provider-cross-mode.mjs',
            'scripts/smoke-cold-reopen.mjs',
            'scripts/smoke-mode-switch-timing.mjs',
            'scripts/audit-branding.mjs'
          )
          $failures = @()
          foreach ($smoke in $smokes) {
            Write-Host "Starting installed smoke: $smoke"
            & ./scripts/with-local-env.ps1 -Executable node -Arguments @($smoke)
            if ($LASTEXITCODE -ne 0) {
              $failures += $smoke
              Write-Warning "Installed smoke failed: $smoke (exit $LASTEXITCODE)"
            }
          }
          $auditPath = '.local-cache/brand-audit/audit.json'
          if (-not (Test-Path -LiteralPath $auditPath)) {
            $failures += 'packaged brand audit result missing'
          } else {
            $audit = Get-Content $auditPath -Raw | ConvertFrom-Json
            if ($audit.summary.builtResidualVisualNames -ne 0 -or @($audit.built | Where-Object present).Count -lt 3) {
              $failures += 'packaged brand audit checks'
            }
          }
          if ($failures.Count -gt 0) { throw "Installed smoke failures: $($failures -join ', ')" }
      - name: Upload unsigned Windows installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hyper-studio-windows-unsigned
          path: apps/desktop/release/Hyper-Studio-Setup.exe
          retention-days: 7
      - name: Preserve Windows smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-smoke-windows
          include-hidden-files: true
          path: |
            .local-tmp/packaged-electron-smoke/*.png
            .local-tmp/first-run-storage-smoke/*.png
            .local-tmp/first-run-storage-smoke/electron.log
            .local-tmp/settings-shortcuts-smoke/electron.log
            .local-tmp/settings-shortcuts-smoke/failure.png
            .local-tmp/packaged-electron-smoke/electron.log
            .local-tmp/packaged-electron-smoke/shared-storage/caches/workflow/*/install.log
            .local-tmp/editor-controls-*/failure.png
            .local-tmp/editor-controls-*/drag-evidence.json
            .local-tmp/editor-controls-*/clip-move-evidence.json
            .local-tmp/editor-track-commands-*/failure.png
            .local-tmp/editor-track-commands-*/results.json
            .local-tmp/editor-track-commands-*/drag-evidence.json
            .local-tmp/workflow-control-smoke-*/workflow-open-failed.png
            .local-tmp/workflow-control-smoke-*/failure.png
            .local-tmp/workflow-control-smoke-*/electron.log
            .local-tmp/workflow-widget-undo-*/*.png
            .local-tmp/workflow-run-isolation-*/*.png
            .local-tmp/manager-install-smoke-*/*.png
            .local-tmp/manager-install-smoke-*/project-create-failed.png
            .local-tmp/manager-install-smoke-*/import-snapshot-failed.png
            .local-tmp/manager-install-smoke-*/post-restart-snapshot-failed.png
          if-no-files-found: ignore
