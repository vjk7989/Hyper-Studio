<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/hyper-studio-mark.svg" />
    <script src="/hyper-studio-storage.js"></script>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <link rel="stylesheet" type="text/css" href="materialdesignicons.min.css" />

    <!-- Fullscreen mode on mobile browsers -->
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Status bar style (eg. black or transparent) -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <style>
      :root {
        --bg-color: #202020;
        --fg-color: #ffffff;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        /* Disable trackpad two-finger horizontal swipe back/forward navigation
           and other overscroll gestures. Hyper-Studio is a full-screen editor; the
           browser's overscroll behaviors only ever leave or break the workflow. */
        overscroll-behavior: none;
      }
      body {
        display: grid;
        background-color: var(--bg-color);
        background-image: var(--bg-img);
        background-position: center;
        background-size: cover;
        background-repeat: no-repeat;
      }
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }
    </style>
    <style>
      #splash-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
    </style>
    <link rel="manifest" href="manifest.json" crossorigin="use-credentials" />
  </head>

  <body class="litegraph grid">
    <div id="splash-loader" role="status" aria-label="Loading Hyper-Studio"><img src="/assets/hyper-studio-mark.svg" alt="" width="64" height="64" /><span style="margin-top: 16px; font: 600 18px system-ui, sans-serif">Hyper-Studio</span></div>
    <script>
      ;(function () {
        var bg, fg
        try {
          bg = localStorage.getItem('hyper-studio-splash-bg')
          fg = localStorage.getItem('hyper-studio-splash-fg')
        } catch (_) {}
        if (!bg || !fg) {
          bg = '#202020'
          fg = '#ffffff'
        }
        document.documentElement.style.setProperty('--bg-color', bg)
        document.documentElement.style.setProperty('--fg-color', fg)
        var el = document.getElementById('splash-loader')
        if (el) {
          el.style.background = bg
          el.style.color = fg
        }
      })()
    </script>
    <div id="vue-app"></div>
    <script type="module" src="src/bootstrap.ts"></script>
  </body>
</html>
